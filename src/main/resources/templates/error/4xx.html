<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/plain}">
<head><title>Request error</title></head>
<body>
<div layout:fragment="content">
    <div class="card text-center">
        <div class="card-body p-5">
            <i class="bi bi-question-circle display-5 text-secondary"></i>
            <h2 class="h4 mt-3">Request error</h2>
            <p class="text-muted">The request could not be processed.</p>
            <a th:href="@{/}" class="btn btn-primary">Go to my dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
