<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · Ticket Management">Ticket Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">

    <aside class="app-sidebar">
        <a class="brand" th:href="@{/}"><i class="bi bi-ticket-perforated me-2"></i>Ticket Desk</a>
        <nav class="flex-grow-1">

            <th:block sec:authorize="hasRole('ADMIN')">
                <div class="nav-section">Overview</div>
                <a class="nav-link" th:href="@{/admin/dashboard}"
                   th:classappend="${#strings.startsWith(currentPath, '/admin/dashboard')} ? 'active'">
                    <i class="bi bi-speedometer2"></i> Dashboard</a>
                <a class="nav-link" th:href="@{/admin/tickets}"
                   th:classappend="${#strings.startsWith(currentPath, '/admin/tickets')} ? 'active'">
                    <i class="bi bi-inboxes"></i> All tickets</a>
                <div class="nav-section">Teams</div>
                <a class="nav-link" th:href="@{/admin/departments}"
                   th:classappend="${#strings.startsWith(currentPath, '/admin/departments')} ? 'active'">
                    <i class="bi bi-diagram-3"></i> Departments</a>
                <a class="nav-link" th:href="@{/admin/agents}"
                   th:classappend="${#strings.startsWith(currentPath, '/admin/agents')} ? 'active'">
                    <i class="bi bi-person-badge"></i> Agents &amp; performance</a>
            </th:block>

            <th:block sec:authorize="hasRole('AGENT')">
                <div class="nav-section">My work</div>
                <a class="nav-link" th:href="@{/agent/dashboard}"
                   th:classappend="${#strings.startsWith(currentPath, '/agent')} ? 'active'">
                    <i class="bi bi-kanban"></i> My tickets</a>
            </th:block>

            <th:block sec:authorize="hasRole('CUSTOMER')">
                <div class="nav-section">Support</div>
                <a class="nav-link" th:href="@{/customer/dashboard}"
                   th:classappend="${currentPath == '/customer/dashboard' or #strings.startsWith(currentPath, '/customer/tickets/') and currentPath != '/customer/tickets/new'} ? 'active'">
                    <i class="bi bi-card-list"></i> My tickets</a>
                <a class="nav-link" th:href="@{/customer/tickets/new}"
                   th:classappend="${currentPath == '/customer/tickets/new'} ? 'active'">
                    <i class="bi bi-plus-circle"></i> New ticket</a>
            </th:block>
        </nav>
    </aside>

    <div class="app-main">
        <header class="app-topbar">
            <h1 layout:fragment="page-title">Dashboard</h1>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-sm-block lh-sm">
                    <div class="fw-semibold" sec:authentication="principal.fullName">User</div>
                    <small class="text-muted text-capitalize"
                           th:text="${#strings.toLowerCase(#authentication.principal.role)}">role</small>
                </div>
                <span class="avatar" sec:authentication="principal.initials">U</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-box-arrow-right"></i> Sign out</button>
                </form>
            </div>
        </header>

        <main class="app-content">
            <div th:replace="~{fragments/components :: flash}"></div>
            <div layout:fragment="content"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
